services:
  postgres:
    image: postgres:17-alpine
    container_name: rqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rqa
      POSTGRES_USER: rqa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rqa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqa_app -d rqa"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rqa_postgres_data:
